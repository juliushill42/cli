# Kamailio Unprivileged SIP Proxy Config for Termux
# Load essential dynamic modules
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "maxfwd.so"
loadmodule "pv.so"

listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060
fork=yes
children=2

route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK - Termux Node Alive");
        exit;
    }
    if (is_method("INVITE")) {
        $du = "sip:127.0.0.1:50051";
        if (!t_relay()) {
            sl_reply_error();
        }
        exit;
    }
    sl_send_reply("405", "Method Not Allowed");
}
